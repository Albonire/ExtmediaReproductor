name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Run linter
        run: pnpm lint

      - name: Build extension
        run: pnpm build:release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: extmediareproductor.zip
          path: dist/builds/extmediareproductor@albonire.github.com.shell-extension.zip
